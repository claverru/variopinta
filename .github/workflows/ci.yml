name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  JUST_VERSION: "1.58.0"
  JUST_SHA256: 4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d

jobs:
  rust-minimum:
    name: Rust 1.87 / locked graph
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.87.0
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake nasm
      - name: Verify and test the locked workspace
        run: |
          cargo metadata --manifest-path rust/Cargo.toml --locked --format-version 1 > /dev/null
          cargo test --manifest-path rust/Cargo.toml --workspace --all-targets --locked

  rust-current:
    name: Current toolchain and source checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake nasm
      - name: Install check tools
        run: |
          python -m pip install ruff==0.12.12
          curl -fsSL \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o /tmp/just.tar.gz
          echo "${JUST_SHA256}  /tmp/just.tar.gz" | sha256sum --check -
          sudo tar -xzf /tmp/just.tar.gz -C /usr/local/bin just
      - name: Check formatting and linting
        run: |
          just format-check
          just lint
          just python-syntax
          just audit-unsafe-evidence
      - name: Test current locked workspace
        run: just test-rust
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsafe-inventory
          path: unsafe-evidence/
          if-no-files-found: error

  release-artifacts:
    name: Build immutable wheel and sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake nasm
      - name: Install build frontend
        run: python -m pip install --upgrade pip maturin==1.9.6 twine==7.0.0
      - name: Verify immutable checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short --untracked-files=no)"
      - name: Build release candidates into an empty directory
        run: |
          mkdir release-dist
          maturin sdist --manifest-path rust/pyext/Cargo.toml --out release-dist
          maturin build --release --locked --compatibility pypi --out release-dist
          twine check --strict release-dist/*
          python scripts/validate_release.py --dist-dir release-dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: release-dist/
          if-no-files-found: error

  artifact-matrix:
    name: Release wheel / CPython ${{ matrix.python }}
    needs: release-artifacts
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release-dist
      - name: Install the shared wheel in a clean interpreter
        run: |
          python -m pip install --upgrade pip
          python -m pip install release-dist/*.whl
      - name: Run base artifact contract
        run: python scripts/smoke_release.py --expected-version 0.1.0
      - name: Run optional Torch contract and complete Python suite
        run: |
          python -m pip install pillow
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python scripts/smoke_release.py --expected-version 0.1.0 --torch
          python -m unittest discover -s tests
          python benchmarks/run_catalog_audit.py
      - name: Record tested artifact provenance
        run: >-
          python scripts/release_evidence.py
          --artifact $(find release-dist -maxdepth 1 -name '*.whl' -print -quit)
          --expected-revision "$GITHUB_SHA"
          --output release-evidence/python-${{ matrix.python }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-python-${{ matrix.python }}
          path: release-evidence/
          if-no-files-found: error

  sdist-rebuild:
    name: Locked rebuild from sdist
    needs: release-artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release-dist
      - name: Install native build tools and frontend
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nasm
          python -m pip install --upgrade pip maturin==1.9.6
      - name: Rebuild the sdist against its locked graph
        run: |
          mkdir release-src sdist-wheel
          python - <<'PY'
          import tarfile
          from pathlib import Path

          source = next(Path("release-dist").glob("*.tar.gz"))
          with tarfile.open(source) as archive:
              archive.extractall("release-src", filter="data")
          PY
          cd release-src/variopinta-0.1.0
          maturin build --release --locked --compatibility pypi --out ../../sdist-wheel
      - name: Test the independently rebuilt wheel
        run: |
          python -m pip install sdist-wheel/*.whl
          python scripts/smoke_release.py --expected-version 0.1.0
          python -m pip install pillow
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python scripts/smoke_release.py --expected-version 0.1.0 --torch
          python -m unittest discover -s tests
          python benchmarks/run_catalog_audit.py
      - name: Record sdist and rebuilt-wheel provenance
        run: >-
          python scripts/release_evidence.py
          --artifact $(find release-dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          --artifact $(find sdist-wheel -maxdepth 1 -name '*.whl' -print -quit)
          --expected-revision "$GITHUB_SHA"
          --output release-evidence/sdist-rebuild.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-sdist
          path: release-evidence/
          if-no-files-found: error

  address-sanitizer:
    name: AddressSanitizer / Linux x86-64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Run core boundary tests under AddressSanitizer
        env:
          RUSTC_BOOTSTRAP: "1"
          RUSTFLAGS: -Zsanitizer=address
        run: >-
          cargo test --manifest-path rust/Cargo.toml -p augment-core
          --target x86_64-unknown-linux-gnu --locked
