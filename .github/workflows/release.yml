name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    name: Build Linux x86-64 wheel and sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TURBOJPEG_SOURCE: vendor
      TURBOJPEG_STATIC: "1"
      TURBOJPEG_BINDING: pregenerated
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install native build tools and release frontends
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nasm
          python -m pip install --upgrade pip maturin==1.9.6 twine==7.0.0
      - name: Validate immutable tagged source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git describe --tags --exact-match)" = "$GITHUB_REF_NAME"
          test -z "$(git status --short --untracked-files=no)"
          python scripts/validate_release.py --tag "$GITHUB_REF_NAME"
      - name: Build Linux candidates once
        run: |
          mkdir release-dist
          maturin sdist --manifest-path rust/pyext/Cargo.toml --out release-dist
          maturin build --release --locked --compatibility pypi --out release-dist
          test "$(find release-dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find release-dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          twine check --strict release-dist/*
          python scripts/validate_release.py --tag "$GITHUB_REF_NAME" \
            --artifact $(find release-dist -maxdepth 1 -name '*.whl' -print -quit) \
            --artifact $(find release-dist -maxdepth 1 -name '*.tar.gz' -print -quit)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-linux-x86-64
          path: release-dist/
          if-no-files-found: error
          retention-days: 90

  build-macos:
    name: Build and inspect macOS ARM64 wheel
    runs-on: macos-15
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      TURBOJPEG_SOURCE: vendor
      TURBOJPEG_STATIC: "1"
      TURBOJPEG_BINDING: pregenerated
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Verify native toolchain and install release frontends
        run: |
          test "$(uname -m)" = arm64
          rustc -vV | grep -Fx "host: aarch64-apple-darwin"
          xcrun clang --version
          cmake --version
          python -m pip install --upgrade pip maturin==1.9.6 twine==7.0.0
      - name: Validate immutable tagged source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git describe --tags --exact-match)" = "$GITHUB_REF_NAME"
          test -z "$(git status --short --untracked-files=no)"
          python scripts/validate_release.py --tag "$GITHUB_REF_NAME"
      - name: Build and inspect the ARM64 candidate once
        run: |
          mkdir release-dist
          maturin build --release --locked --compatibility pypi --out release-dist
          test "$(find release-dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          wheel=$(find release-dist -maxdepth 1 -name '*.whl' -print -quit)
          twine check --strict "$wheel"
          python scripts/validate_release.py --tag "$GITHUB_REF_NAME" --artifact "$wheel"
          python scripts/inspect_macos_wheel.py "$wheel"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-macos-arm64
          path: release-dist/
          if-no-files-found: error
          retention-days: 90

  wheel:
    name: ${{ matrix.platform }} wheel / CPython ${{ matrix.python }}
    needs: [build-linux, build-macos]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        platform: [linux-x86-64, macos-arm64]
        include:
          - platform: linux-x86-64
            runner: ubuntu-24.04
            artifact: candidate-linux-x86-64
            wheel_tag: manylinux_2_34_x86_64
          - platform: macos-arm64
            runner: macos-15
            artifact: candidate-macos-arm64
            wheel_tag: macosx_11_0_arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: release-dist
      - name: Install the exact candidate wheel
        run: |
          if [ "${{ matrix.platform }}" = macos-arm64 ]; then test "$(uname -m)" = arm64; fi
          test "$(find release-dist -maxdepth 1 -name '*-${{ matrix.wheel_tag }}.whl' | wc -l)" -eq 1
          wheel=$(find release-dist -maxdepth 1 -name '*-${{ matrix.wheel_tag }}.whl' -print -quit)
          python -m pip install --upgrade pip
          python -m pip install "$wheel"
      - name: Test base, optional Torch, and catalog contracts
        run: |
          python scripts/smoke_release.py --expected-version "${GITHUB_REF_NAME#v}"
          python -m pip install pillow
          if [ "${{ matrix.platform }}" = linux-x86-64 ]; then
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          else
            python -m pip install torch
          fi
          python scripts/smoke_release.py --expected-version "${GITHUB_REF_NAME#v}" --torch
          python -m unittest discover -s tests
          python benchmarks/run_catalog_audit.py
      - name: Record tested wheel provenance
        run: >-
          python scripts/release_evidence.py
          --artifact $(find release-dist -maxdepth 1 -name '*-${{ matrix.wheel_tag }}.whl' -print -quit)
          --expected-revision "$GITHUB_SHA"
          --output release-evidence/${{ matrix.platform }}-python-${{ matrix.python }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ matrix.platform }}-python-${{ matrix.python }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 90

  sdist:
    name: ${{ matrix.platform }} locked rebuild from exact sdist
    needs: build-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      TURBOJPEG_SOURCE: vendor
      TURBOJPEG_STATIC: "1"
      TURBOJPEG_BINDING: pregenerated
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86-64
            runner: ubuntu-24.04
            wheel_tag: manylinux_2_34_x86_64
          - platform: macos-arm64
            runner: macos-15
            wheel_tag: macosx_11_0_arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-linux-x86-64
          path: release-dist
      - name: Install native build tools and frontend
        run: |
          if [ "${{ matrix.platform }}" = linux-x86-64 ]; then
            sudo apt-get update
            sudo apt-get install -y cmake nasm
          else
            test "$(uname -m)" = arm64
            cmake --version
            echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
          fi
          python -m pip install --upgrade pip maturin==1.9.6
      - name: Rebuild the exact sdist against its locked graph
        run: |
          mkdir release-src sdist-wheel
          python - <<'PY'
          import tarfile
          from pathlib import Path

          source = next(Path("release-dist").glob("*.tar.gz"))
          with tarfile.open(source) as archive:
              archive.extractall("release-src", filter="data")
          PY
          cd "release-src/variopinta-${GITHUB_REF_NAME#v}"
          maturin build --release --locked --compatibility pypi --out ../../sdist-wheel
      - name: Inspect and test the independently rebuilt wheel
        run: |
          test "$(find sdist-wheel -maxdepth 1 -name '*-${{ matrix.wheel_tag }}.whl' | wc -l)" -eq 1
          wheel=$(find sdist-wheel -maxdepth 1 -name '*-${{ matrix.wheel_tag }}.whl' -print -quit)
          python scripts/validate_release.py --tag "$GITHUB_REF_NAME" --artifact "$wheel"
          if [ "${{ matrix.platform }}" = macos-arm64 ]; then
            python scripts/inspect_macos_wheel.py "$wheel"
          fi
          python -m pip install "$wheel"
          python scripts/smoke_release.py --expected-version "${GITHUB_REF_NAME#v}"
          python -m pip install pillow
          if [ "${{ matrix.platform }}" = linux-x86-64 ]; then
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          else
            python -m pip install torch
          fi
          python scripts/smoke_release.py --expected-version "${GITHUB_REF_NAME#v}" --torch
          python -m unittest discover -s tests
          python benchmarks/run_catalog_audit.py
      - name: Record sdist and rebuilt-wheel provenance
        run: >-
          python scripts/release_evidence.py
          --artifact $(find release-dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          --artifact $(find sdist-wheel -maxdepth 1 -name '*-${{ matrix.wheel_tag }}.whl' -print -quit)
          --expected-revision "$GITHUB_SHA"
          --output release-evidence/sdist-rebuild-${{ matrix.platform }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-sdist-${{ matrix.platform }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 90

  assemble:
    name: Assemble approved immutable artifacts
    needs: [build-linux, build-macos, wheel, sdist]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-linux-x86-64
          path: candidate-linux
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-macos-arm64
          path: candidate-macos
      - name: Merge and validate the complete release set
        run: |
          python -m pip install twine==7.0.0
          mkdir release-dist
          cp candidate-linux/*.whl candidate-linux/*.tar.gz candidate-macos/*.whl release-dist/
          twine check --strict release-dist/*
          python scripts/validate_release.py --tag "$GITHUB_REF_NAME" --dist-dir release-dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: release-dist/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish approved artifacts to PyPI
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/variopinta
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release-dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release-dist/

  github-release:
    name: Create GitHub release from approved artifacts
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release-dist
      - name: Extract release notes from the changelog
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"].removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text()
          heading = f"## {version}\n"
          if heading not in changelog:
              raise SystemExit(f"missing changelog entry for {version}")
          notes = changelog.split(heading, 1)[1].split("\n## ", 1)[0].strip()
          Path("release-notes.md").write_text(f"# Variopinta {version}\n\n{notes}\n")
          PY
      - name: Create the release with the published files
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-dist/*
          --verify-tag
          --title "Variopinta ${GITHUB_REF_NAME#v}"
          --notes-file release-notes.md
